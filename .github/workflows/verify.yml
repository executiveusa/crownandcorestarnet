name: Crown & Core Verify

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - build/phase-1-gap-audit

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify
        run: npm run verify
