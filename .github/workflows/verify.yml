name: Crown & Core Verify

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - build/phase-1-gap-audit

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify
        run: npm run verify

  docker-computers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Docker availability
        run: docker version

      - name: Prove one isolated Docker computer per agent
        run: npm run runtime:prove:docker

      - name: Run Manny proof mission on isolated Docker computers
        run: npm run runtime:mission:docker

      - name: Prove per-agent internal model-gateway path
        run: npm run runtime:mission:gateway-proof

      - name: Upload machine-verifiable proof receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crown-core-runtime-proof
          if-no-files-found: warn
          retention-days: 30
          path: |
            outbox/DOCKER-COMPUTER-PROOF.json
            .runtime/missions/**/MISSION-RECEIPT.json
            .runtime/missions/**/*.job.json
            .runtime/computers/*/receipts/*.json
            outbox/DATA-READINESS.json
            outbox/LIVE-READINESS.json
            outbox/STATE-PROMOTION-CANDIDATE.json
            outbox/STATE-PROMOTION-RECEIPT.json
