openapi: 3.1.0
info:
  title: Crown & Core Creator Studio — Local Proof API
  version: 0.4.0
  description: >
    Local loopback-only API with role-separated workflow, signed callbacks and
    optional OIDC reviewer identity. External provider adapters are coded but
    not connected or deployed. This contract does not represent actual video
    rendering, real publication, voice identity or verified bookings.
servers:
  - url: http://127.0.0.1:8787
    description: Loopback local proof only
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Proof mode and execution-disabled status
      security: []
      responses:
        '200':
          description: Proof mode
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string }
                  mode: { const: LOCAL_PROOF }
                  live_renderer: { const: false }
                  publication_enabled: { const: false }
                  paid_spend_enabled: { const: false }
  /v1/outcomes:
    get:
      summary: Bounded Crown & Core outcome summaries
      x-required-role: authenticated
      responses:
        '200':
          description: Last 25 outcome summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  outcomes:
                    type: array
                    items: { $ref: '#/components/schemas/Summary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create a draft outcome, no production action
      x-required-role: agent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOutcome' }
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutcomeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/outcomes/{id}:
    parameters:
      - $ref: '#/components/parameters/OutcomeId'
    get:
      summary: Read exact current outcome revision
      x-required-role: authenticated
      responses:
        '200':
          description: Current outcome and receipts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutcomeEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/outcomes/{id}/summary:
    parameters:
      - $ref: '#/components/parameters/OutcomeId'
    get:
      summary: Read concise status for Instinct
      x-required-role: authenticated
      responses:
        '200':
          description: Outcome summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary: { $ref: '#/components/schemas/Summary' }
  /v1/outcomes/{id}/source:
    parameters:
      - $ref: '#/components/parameters/OutcomeId'
    post:
      summary: Record unverified source and rights references
      x-required-role: agent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Source' }
      responses:
        '200':
          description: Draft updated; prior approvals invalidated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutcomeEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/outcomes/{id}/storyboard:
    parameters:
      - $ref: '#/components/parameters/OutcomeId'
    post:
      summary: Propose storyboard and explicit claim/disclosure flags
      x-required-role: agent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Storyboard' }
      responses:
        '200':
          description: Draft updated; prior approvals invalidated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutcomeEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/outcomes/{id}/review-request:
    parameters:
      - $ref: '#/components/parameters/OutcomeId'
    post:
      summary: Request human review, no notification or approval
      x-required-role: agent
      responses:
        '200':
          description: Review pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutcomeEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/outcomes/{id}/approvals:
    parameters:
      - $ref: '#/components/parameters/OutcomeId'
    post:
      summary: Exact-version local proof reviewer decision
      description: >
        Only owner/clinical bearer roles may call. A local bearer token is NOT a
        production-grade voice authentication or legal consent mechanism.
      x-required-role: owner-or-clinical
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Decision' }
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutcomeEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/outcomes/{id}/render-plan:
    parameters:
      - $ref: '#/components/parameters/OutcomeId'
    post:
      summary: Prepare a non-executing external render plan
      x-required-role: agent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenderPlanInput' }
      responses:
        '200':
          description: PLANNED_NOT_SUBMITTED; no provider call or charge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutcomeEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/outcomes/{id}/rights-verify:
    parameters:
      - $ref: '#/components/parameters/OutcomeId'
    post:
      summary: Verify independent rights grant and asset hashes
      x-required-role: rights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: See OPERATIONS.md and src/pipeline.mjs for exact transition requirements.
      responses:
        '200':
          description: Receipt-backed outcome; no implied external execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutcomeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/outcomes/{id}/render-authorize:
    parameters:
      - $ref: '#/components/parameters/OutcomeId'
    post:
      summary: Authorize capped render of current creative revision
      x-required-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: See OPERATIONS.md and src/pipeline.mjs for exact transition requirements.
      responses:
        '200':
          description: Receipt-backed outcome; no implied external execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutcomeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/outcomes/{id}/dispatch-reserve:
    parameters:
      - $ref: '#/components/parameters/OutcomeId'
    post:
      summary: Reserve render before provider call; no automatic retry
      x-required-role: operator
      requestBody:
        required: true
        content:
          application/json:
