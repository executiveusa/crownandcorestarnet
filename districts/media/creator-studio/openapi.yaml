    post:
      summary: Reserve a single organic publication attempt
      x-required-role: publisher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: See OPERATIONS.md and src/pipeline.mjs for exact transition requirements.
      responses:
        '200':
          description: Receipt-backed outcome; no implied external execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutcomeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/outcomes/{id}/publish-receipt:
    parameters:
      - $ref: '#/components/parameters/OutcomeId'
    post:
      summary: Record verified external organic post receipt
      x-required-role: publisher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: See OPERATIONS.md and src/pipeline.mjs for exact transition requirements.
      responses:
        '200':
          description: Receipt-backed outcome; no implied external execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutcomeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/outcomes/{id}/attribution:
    parameters:
      - $ref: '#/components/parameters/OutcomeId'
    post:
      summary: Record source-backed aggregate bookings and revenue
      x-required-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: See OPERATIONS.md and src/pipeline.mjs for exact transition requirements.
      responses:
        '200':
          description: Receipt-backed outcome; no implied external execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutcomeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/outcomes/{id}/job-fail:
    parameters:
      - $ref: '#/components/parameters/OutcomeId'
    post:
      summary: Record render failure without claiming completion
      x-required-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: See OPERATIONS.md and src/pipeline.mjs for exact transition requirements.
      responses:
        '200':
          description: Receipt-backed outcome; no implied external execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutcomeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/outcomes/{id}/rights-revoke:
    parameters:
      - $ref: '#/components/parameters/OutcomeId'
    post:
      summary: Revoke source rights and require takedown if published
      x-required-role: rights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: See OPERATIONS.md and src/pipeline.mjs for exact transition requirements.
      responses:
        '200':
          description: Receipt-backed outcome; no implied external execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutcomeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/outcomes/{id}/takedown-receipt:
    parameters:
      - $ref: '#/components/parameters/OutcomeId'
    post:
      summary: Record actual external removal receipt
      x-required-role: publisher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: See OPERATIONS.md and src/pipeline.mjs for exact transition requirements.
      responses:
        '200':
          description: Receipt-backed outcome; no implied external execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutcomeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/outcomes/{id}/creator-candidate:
    parameters:
      - $ref: '#/components/parameters/OutcomeId'
    post:
      summary: Propose opaque creator reference without contact
      x-required-role: agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: See OPERATIONS.md and src/creators.mjs for exact transition requirements.
      responses:
        '200':
          description: Receipt-backed outcome; no implied external execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutcomeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/outcomes/{id}/creator-outreach:
    parameters:
      - $ref: '#/components/parameters/OutcomeId'
    post:
      summary: Prepare an unsent creator message
      x-required-role: agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: See OPERATIONS.md and src/creators.mjs for exact transition requirements.
      responses:
        '200':
          description: Receipt-backed outcome; no implied external execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutcomeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/outcomes/{id}/creator-outreach-authorize:
    parameters:
      - $ref: '#/components/parameters/OutcomeId'
    post:
      summary: Authorize exact outreach message, fee cap and permission
      x-required-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: See OPERATIONS.md and src/creators.mjs for exact transition requirements.
      responses:
        '200':
          description: Receipt-backed outcome; no implied external execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutcomeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/outcomes/{id}/creator-outreach-reserve:
    parameters:
      - $ref: '#/components/parameters/OutcomeId'
    post:
      summary: Reserve a single authorized creator contact attempt
      x-required-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: See OPERATIONS.md and src/creators.mjs for exact transition requirements.
      responses:
        '200':
          description: Receipt-backed outcome; no implied external execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutcomeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
