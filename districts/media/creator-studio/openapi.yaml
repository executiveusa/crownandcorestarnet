      - $ref: '#/components/parameters/OutcomeId'
    post:
      summary: Record actual zero-spend creator delivery receipt
      x-required-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: See OPERATIONS.md and src/creators.mjs for exact transition requirements.
      responses:
        '200':
          description: Receipt-backed outcome; no implied external execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutcomeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/outcomes/{id}/creator-release:
    parameters:
