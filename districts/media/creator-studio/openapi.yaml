              schema: { $ref: '#/components/schemas/OutcomeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/outcomes/{id}/qa-verify:
    parameters:
      - $ref: '#/components/parameters/OutcomeId'
    post:
      summary: Record independently checked 30s and 15s MP4 hashes
      x-required-role: qa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: See OPERATIONS.md and src/pipeline.mjs for exact transition requirements.
      responses:
        '200':
          description: Receipt-backed outcome; no implied external execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutcomeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/outcomes/{id}/film-approve:
    parameters:
      - $ref: '#/components/parameters/OutcomeId'
    post:
      summary: Approve exact final video hashes
      x-required-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
