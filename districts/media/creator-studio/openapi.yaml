    post:
      summary: Record independently verified creator release
      x-required-role: rights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: See OPERATIONS.md and src/creators.mjs for exact transition requirements.
      responses:
        '200':
          description: Receipt-backed outcome; no implied external execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutcomeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/webhooks/provider/{id}:
    parameters:
      - $ref: '#/components/parameters/OutcomeId'
    post:
      summary: HMAC-SHA256 signed provider callback from approved bridge
      security: []
      description: >
        Required x-studio-timestamp, x-studio-event-id and x-studio-signature headers.
        Signature covers timestamp.event_id.raw_body. No unsigned or stale callbacks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_ref, version]
              properties:
                event_ref: { type: string }
                version: { type: integer }
      responses:
        '200': { description: Verified signed event applied }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/webhooks/attribution/{id}:
    parameters:
      - $ref: '#/components/parameters/OutcomeId'
    post:
      summary: HMAC-SHA256 signed attribution callback from approved bridge
      security: []
      description: >
        Required x-studio-timestamp, x-studio-event-id and x-studio-signature headers.
        Signature covers timestamp.event_id.raw_body. No unsigned or stale callbacks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_ref, version]
              properties:
                event_ref: { type: string }
                version: { type: integer }
      responses:
        '200': { description: Verified signed event applied }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/buffer/status:
    get:
      summary: Read authenticated Buffer Blaster service status through StarNet
      description: No credentials, wallets, media or patient data returned; no paid execution.
      x-required-role: authenticated
      responses:
        '200':
          description: Actual upstream health and approval gate state
          content:
            application/json:
              schema:
                type: object
                properties:
                  buffer:
                    type: object
                    properties:
                      connected: { type: boolean }
                      version: { type: string }
                      crown_30_15_render_supported: { const: false }
                      paid_execution_enabled: { const: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Buffer bridge not configured }
  /v1/buffer/mcp-tools:
    get:
      summary: Discover authenticated Buffer MCP tool NAMES only
      x-required-role: authenticated
      description: >
        StarNet never provides an arbitrary Buffer MCP tools/call proxy to agents.
        The returned names are read-only capability discovery, not authorization.
      responses:
        '200': { description: Tool catalog readback; no external tool executed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Buffer bridge not configured }
  /v1/outcomes/{id}/buffer-source-bind:
    parameters:
      - $ref: '#/components/parameters/OutcomeId'
    post:
      summary: Independently bind exactly one workspace-scoped Buffer media source
      x-required-role: rights
      description: >
        Requires existing StarNet exact-version owner/clinical approval,
        rights grant and asset hash. The rights worker validates Buffer's
        GET /api/studio/references/{uuid} against server-authorized workspace.
        Source membership is not itself rights/consent verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, source_uuid]
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 1 }
                source_uuid: { type: string, format: uuid }
      responses:
        '200': { description: Trusted source projection and append-only receipt }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { description: Buffer bridge not configured }
  /v1/outcomes/{id}/buffer-plan:
    parameters:
      - $ref: '#/components/parameters/OutcomeId'
    post:
      summary: Sync approved creative into Buffer's zero-spend canonical plan ledger
      x-required-role: agent
      description: >
        Request body must be an EMPTY JSON object. StarNet constructs approved
        script and media references from canonical state and requires Buffer
        Supabase backend, exact creative/rights/idempotency readback. A plan is
        not video generation or an ad spending approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              maxProperties: 0
              additionalProperties: false
      responses:
        '200':
          description: A confirmed 0-cent DRAFT UGC plan with an external plan ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  outcome: { type: object }
                  external:
                    type: object
                    properties:
                      plan_id: { type: string, format: uuid }
                      backend: { const: supabase }
                      readback_verified: { const: true }
                      paid_generation: { const: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { description: Buffer bridge not configured }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Distinct local agent/owner/clinical tokens. Never expose owner token to MCP.
  parameters:
    OutcomeId:
      name: id
      in: path
      required: true
      schema: { type: string }
  schemas:
    CreateOutcome:
      type: object
      required: [outcome]
      properties:
        tenant_id: { type: string, const: crown-and-core }
        outcome: { type: string, minLength: 1, maxLength: 500 }
        goal: { type: string, enum: [qualified_inquiries, booking_intent, owned_media], default: booking_intent }
        placement: { type: string, enum: [instagram_reel, facebook_reel, youtube_short, organic_video], default: instagram_reel }
        creative_direction: { type: string, maxLength: 600 }
        service_ref: { type: string, maxLength: 120 }
    Source:
      type: object
      required: [source_type, source_ref, rights_ref, usage_scope]
      properties:
        source_type: { type: string, enum: [facility, creator, staff, synthetic] }
        source_ref: { type: string, description: Opaque ID, not private URL }
        rights_ref: { type: string, description: Opaque unverified rights record ID }
        usage_scope: { type: string, enum: [organic, paid, both] }
    Storyboard:
      type: object
      required: [hook, story, cta, claims_present, disclosure_present]
      properties:
        hook: { type: string, maxLength: 280 }
        story: { type: string, maxLength: 900 }
        cta: { type: string, maxLength: 280 }
        claims_present: { type: boolean }
        disclosure_present: { type: boolean }
    Decision:
      type: object
      description: >
        Role-dependent approval: owner approve requires rights_confirmed=true;
        clinical approve requires a nonempty opaque claim_ref even for a
        claim-free screening. Clinical approval without claim_ref returns
        HTTP 400 INVALID_REF. Every medspa render requires independent
        clinical screening regardless of the agent's claims_present flag.
      x-role-dependent-required:
        owner_approve: [version, decision, rights_confirmed]
        clinical_approve: [version, decision, claim_ref]
      required: [version, decision]
      properties:
        version: { type: integer, minimum: 1 }
        decision: { type: string, enum: [approve, request_changes] }
        rights_confirmed: { type: boolean, description: Owner attestation; actual rights verification remains external }
        claim_ref: { type: string, description: Clinical reviewer approved claim reference }
    RenderPlanInput:
      type: object
      required: [provider, idempotency_key, max_cost_usd]
      properties:
        provider: { type: string, enum: [motion-master, montage] }
        idempotency_key: { type: string }
        max_cost_usd: { type: number, minimum: 0, maximum: 1000, description: Planning cap, not spending approval }
    Summary:
      type: object
      required: [id, tenant_id, version, status, outcome, next_action, verified_video, published]
      properties:
        id: { type: string }
        tenant_id: { const: crown-and-core }
        version: { type: integer }
        status: { type: string, enum: [DRAFT, REVIEW_PENDING, READY_FOR_RENDER_PLAN, RENDER_PLAN_READY] }
        outcome: { type: string }
        next_action: { type: string }
        verified_video: { const: false }
        published: { const: false }
        attributed_bookings: { type: 'null' }
        attributed_revenue: { type: 'null' }
    OutcomeEnvelope:
      type: object
      properties:
        outcome: { type: object, description: Versioned outcome including source/storyboard/approvals/receipts }
  responses:
    Unauthorized:
      description: Missing or invalid bearer credential
    Forbidden:
      description: Role or tenant not authorized
    NotFound:
      description: Outcome not found
    BadRequest:
      description: Invalid input or prohibited content
    Conflict:
      description: Missing evidence, stale approval, duplicate plan or forbidden transition
